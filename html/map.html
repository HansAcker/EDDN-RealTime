<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">

<!-- https://github.com/HansAcker/EDDN-RealTime -->
<title>Elite Dangerous Data Network Real Time Feed</title>
<meta name="description" content="Live Events from the Elite Dangerous Data Network">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
	.galaxymap {
		position: relative;
		width: 100vmin;
		height: 100vmin;
		margin: auto;
	}

	.galaxymap object,
	.galaxymap canvas {
		height: 100%;
		display: block;
		position: absolute;
		top: 0;
		left: 0;
	}

	.galaxymap canvas {
/*		pointer-events: none; */
	}
</style>


<div class="galaxymap">
	<object id="regions" type="image/svg+xml" data="data/RegionMap.svg"></object>
	<canvas id="plot" width="1024" height="1024"></canvas>
</div>

	}
}
